# Settings for this game only. `minetest.conf` at a game's root supplies
# defaults when that game is run (lua_api.md, "Game directory structure"), and
# core.settings reads that layer, so the suite is enabled by booting the fixture
# and by nothing else.
#
# This is what replaced writing codeblock_run_tests into the player's real
# minetest.conf and stripping it again afterwards - the rule scripts/run_tests.ps1
# used to be built around, and the source of two defects in that file alone
# (B31, B32). A game default cannot reach the player's own game, and `tests
# export-ignore` keeps this file out of the release archive. (C24)
#
# A user config still overrides both, which is the way to boot this game and
# stay in it: codeblock_run_tests_exit = false.

codeblock_run_tests = true

# Shut the server down once the suite has reported, so nothing has to guess how
# long it takes.
codeblock_run_tests_exit = true
