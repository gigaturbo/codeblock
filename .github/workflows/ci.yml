name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Component-level CI for the CodeBlock mod: lint and unit-test this mod's own
# code. The Codecube game that embeds this mod runs a separate, integration-level
# workflow and does not duplicate these checks.

jobs:
  lint:
    name: luacheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.1"

      - uses: leafo/gh-actions-luarocks@v4

      - name: Install luacheck
        run: luarocks install luacheck

      - name: Lint
        run: |
          luacheck . --formatter plain --codes > luacheck.txt 2>&1 || true
          cat luacheck.txt
          # Re-emit findings as inline annotations. Besides showing up on the
          # diff in a PR, annotations are readable through the public
          # check-runs API, which the raw job log is not.
          sed -nE 's#^([^:]+):([0-9]+):([0-9]+): (.*)$#::error file=\1,line=\2::\4#p' luacheck.txt
          if grep -qE '^[^:]+:[0-9]+:[0-9]+: ' luacheck.txt; then
            exit 1
          fi
          # No findings matched, yet luacheck may still have failed - a bad
          # config, for instance. Surface the raw output rather than fail silently.
          if grep -qiE 'error|cannot|could not|unknown' luacheck.txt; then
            echo "::error::luacheck did not report findings but failed: $(head -c 800 luacheck.txt | tr '\n' ' ')"
            exit 1
          fi

      - name: Report what the baseline exemptions hide
        # Informational only, and if: always() so it still reports when the
        # blocking lint above fails - which is when it is most useful.
        if: always()
        continue-on-error: true
        env:
          LUACHECK_STRICT: "1"
        run: |
          luacheck . --formatter plain --codes > strict.txt 2>&1 || true
          cat strict.txt
          sed -nE 's#^([^:]+):([0-9]+):([0-9]+): (.*)$#::warning file=\1,line=\2::[exempted] \4#p' strict.txt
          echo "exempted findings: $(grep -cE '^[^:]+:[0-9]+:[0-9]+: ' strict.txt || true)"

  test:
    name: preprocessor spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: leafo/gh-actions-lua@v10
        with:
          # Plain 5.1 rather than a luajit-* value: every LuaJIT variant fails
          # to build in this action on ubuntu-latest. Luanti runs Lua 5.1
          # semantics either way, which is what these string-handling specs
          # exercise. They also run in-engine under Luanti's real LuaJIT when
          # the game is started with codeblock_run_tests = true.
          luaVersion: "5.1"

      # api_spec pins every name the sandbox environment exposes. It is the
      # regression guard for the change most likely to break saved player
      # programs - a renamed or dropped API name - so it belongs here above
      # all the others. It was hooked into the in-engine runner when it was
      # written and never added here, which meant an API rename would have
      # passed CI.
      - name: Run API spec
        run: lua tests/api_spec.lua

      - name: Run preprocessor spec
        run: lua tests/preprocess_spec.lua

      - name: Run env spec
        run: lua tests/env_spec.lua

      # The shapes were ported by hand out of the WorldEdit fork, so this spec
      # restates each one in world coordinates and compares the index sets. It
      # fakes VoxelArea and VoxelManip, which is why it needs no engine.
      - name: Run shapes spec
        run: lua tests/shapes_spec.lua

      - name: Run string-guard spec
        run: lua tests/strguard_spec.lua

      # The budget arithmetic: ceilings, unit conversions, and the decay of the
      # map footprint over the engine's unload window. Pure arithmetic with an
      # injected clock, so it needs no engine.
      - name: Run limits spec
        run: lua tests/limits_spec.lua

  docs:
    name: docs are generated from the code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.1"

      # Stronger than the check this replaced. That one compared the docs against
      # the config and reported mismatches; this regenerates the reference from
      # lib/api.lua and fails if the committed file differs, so the docs cannot
      # describe an API that does not exist.
      - name: Check doc/api.md is up to date
        run: lua scripts/gen_docs.lua --check

      # Same shape, for the other file that mirrors the source and had nothing
      # comparing it: locale/template.txt is a translator's list of every
      # message the mod sends, and it had drifted twelve messages out of date in
      # each direction (C17). Fails on the template only - an untranslated
      # string falls back to English, which is a state a translation is allowed
      # to be in, so the .tr report is printed and does not fail the job.
      - name: Check locale/template.txt is up to date
        run: lua scripts/gen_locale.lua --check
