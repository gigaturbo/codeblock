name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Component-level CI for the CodeBlock mod: lint and unit-test this mod's own
# code. The Codecube game that embeds this mod runs a separate, integration-level
# workflow and does not duplicate these checks.

jobs:
  lint:
    name: luacheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.1"

      - uses: leafo/gh-actions-luarocks@v4

      - name: Install luacheck
        run: luarocks install luacheck

      - name: Lint
        run: |
          luacheck . --formatter plain --codes > luacheck.txt 2>&1 || true
          cat luacheck.txt
          # Re-emit findings as inline annotations. Besides showing up on the
          # diff in a PR, annotations are readable through the public
          # check-runs API, which the raw job log is not.
          sed -nE 's#^([^:]+):([0-9]+):([0-9]+): (.*)$#::error file=\1,line=\2::\4#p' luacheck.txt
          if grep -qE '^[^:]+:[0-9]+:[0-9]+: ' luacheck.txt; then
            exit 1
          fi
          # No findings matched, yet luacheck may still have failed - a bad
          # config, for instance. Surface the raw output rather than fail silently.
          if grep -qiE 'error|cannot|could not|unknown' luacheck.txt; then
            echo "::error::luacheck did not report findings but failed: $(head -c 800 luacheck.txt | tr '\n' ' ')"
            exit 1
          fi

      - name: Report what the baseline exemptions hide
        # Informational only, and if: always() so it still reports when the
        # blocking lint above fails - which is when it is most useful.
        if: always()
        continue-on-error: true
        env:
          LUACHECK_STRICT: "1"
        run: |
          luacheck . --formatter plain --codes > strict.txt 2>&1 || true
          cat strict.txt
          sed -nE 's#^([^:]+):([0-9]+):([0-9]+): (.*)$#::warning file=\1,line=\2::[exempted] \4#p' strict.txt
          echo "exempted findings: $(grep -cE '^[^:]+:[0-9]+:[0-9]+: ' strict.txt || true)"

  test:
    name: preprocessor spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: leafo/gh-actions-lua@v10
        with:
          # Plain 5.1 rather than a luajit-* value: every LuaJIT variant fails
          # to build in this action on ubuntu-latest. Luanti runs Lua 5.1
          # semantics either way, which is what these string-handling specs
          # exercise. They also run in-engine under Luanti's real LuaJIT when
          # the game is started with codeblock_run_tests = true.
          luaVersion: "5.1"

      # api_spec pins every name the sandbox environment exposes. It is the
      # regression guard for the change most likely to break saved player
      # programs - a renamed or dropped API name - so it belongs here above
      # all the others. It was hooked into the in-engine runner when it was
      # written and never added here, which meant an API rename would have
      # passed CI.
      - name: Run API spec
        run: lua tests/api_spec.lua

      - name: Run preprocessor spec
        run: lua tests/preprocess_spec.lua

      - name: Run env spec
        run: lua tests/env_spec.lua

      # The shapes were ported by hand out of the WorldEdit fork, so this spec
      # restates each one in world coordinates and compares the index sets. It
      # fakes VoxelArea and VoxelManip, which is why it needs no engine.
      - name: Run shapes spec
        run: lua tests/shapes_spec.lua

      - name: Run string-guard spec
        run: lua tests/strguard_spec.lua

      # The budget arithmetic: ceilings, unit conversions, and the decay of the
      # map footprint over the engine's unload window. Pure arithmetic with an
      # injected clock, so it needs no engine.
      - name: Run limits spec
        run: lua tests/limits_spec.lua

  engine:
    name: the nine specs in Luanti
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # mod.conf reads `depends = vector3`, and the engine will not load a
          # mod whose depends are unmet. Without the submodule the boot fails
          # and nothing reports.
          submodules: recursive

      # Upstream's own server-only build of the exact version this mod is
      # developed against - no build step here, and no third party's binary.
      # It is a LuaJIT build, so this is also the first CI job to run the mod
      # on the interpreter the engine actually uses rather than plain 5.1.
      - name: Pull the engine
        run: docker pull ghcr.io/luanti-org/luanti:5.17.0

      # The game has to contain this repository as one of its mods, so it is
      # assembled outside the workspace and handed over as one mount. A symlink
      # would point at a host path the container cannot see, and `git archive`
      # would obey `tests export-ignore` and drop the specs it is here to run.
      #
      # tests/game is excluded from the mod copy: the fixture's own mods are
      # already in place above it, and copying them twice copies vector3 twice.
      - name: Assemble the fixture game
        run: |
          mkdir -p /tmp/cb/games/cbtest/mods/codeblock
          cp -r tests/game/. /tmp/cb/games/cbtest/
          rsync -a --exclude .git --exclude tests/game \
            ./ /tmp/cb/games/cbtest/mods/codeblock/
          # The image runs as uid 30000, which owns none of this.
          chmod -R a+rX /tmp/cb
          test -f /tmp/cb/games/cbtest/mods/codeblock/mod.conf
          test -f /tmp/cb/games/cbtest/mods/vector3/init.lua

      # tests/game/minetest.conf enables the suite and asks for a shutdown once
      # it has reported, so this returns on its own; the timeout is only a
      # ceiling. LUANTI_GAME_PATH appends to the game search path, so --gameid
      # finds the fixture without depending on where the image puts path_user.
      # No --server: that flag exists only in a client build, and this is not
      # one, so passing it would be an unrecognised option.
      #
      # HOME is set explicitly. The image declares none, relying on Docker
      # deriving it from /etc/passwd; without it the engine cannot build
      # path_user and dies on `Required environment variable HOME is not set`.
      - name: Run the suite
        run: |
          timeout 180 docker run --rm \
            -e LUANTI_GAME_PATH=/cb/games \
            -e HOME=/var/lib/minetest \
            -v /tmp/cb/games:/cb/games:ro \
            ghcr.io/luanti-org/luanti:5.17.0 \
            --gameid cbtest --world /var/lib/minetest/cbworld \
            > engine.log 2>&1 || true
          cat engine.log

      # init.lua prints one verdict line covering every criterion, so this job
      # restates none of them. `0 skipped` is not redundant beside `9/9`: a spec
      # that declares itself unable to run is the failure a per-spec eyeball
      # misses, and breaking the guard forms_spec exists to hold once lost 66
      # assertions while the run still reported nine specs.
      #
      # The `grep -o` is load-bearing: init.lua prints the line indented, and
      # the anchored pattern rejects it with the leading spaces intact.
      - name: Read the result
        run: |
          verdict=$(grep -o 'suite: .*' engine.log || true)
          if [ -z "$verdict" ]; then
            # Every way this job can fail before the suite reports arrives here
            # - no HOME, the game not found, the fixture conf missing, an
            # unwritable world - so name none of them and print the log instead.
            echo "::error::the suite did not report; the tail of the engine log follows"
            tail -40 engine.log
            exit 1
          fi
          echo "$verdict"
          # Anchored on the whole line, not on substrings: `*0 failed*` would
          # also match `10 failed`.
          if ! printf '%s\n' "$verdict" | grep -qE \
            '^suite: 9/9 specs +[0-9]+ passed +0 failed +[0-9]+ xfail +0 xpass +0 skipped$'
          then
            echo "::error::$verdict"
            exit 1
          fi
          if grep -q ModError engine.log; then
            echo "::error::the suite reported, but a mod raised: $(grep -m1 ModError engine.log)"
            exit 1
          fi

  docs:
    name: docs are generated from the code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.1"

      # Stronger than the check this replaced. That one compared the docs against
      # the config and reported mismatches; this regenerates the reference from
      # lib/api.lua and fails if the committed file differs, so the docs cannot
      # describe an API that does not exist.
      - name: Check doc/api.md is up to date
        run: lua scripts/gen_docs.lua --check

      # Same shape, for the other file that mirrors the source and had nothing
      # comparing it: locale/template.txt is a translator's list of every
      # message the mod sends, and it had drifted twelve messages short and
      # seventeen stale (C17). Fails on the template only - an untranslated
      # string falls back to English, which is a state a translation is allowed
      # to be in, so the .tr report is printed and does not fail the job.
      - name: Check locale/template.txt is up to date
        run: lua scripts/gen_locale.lua --check

      # The third and last of the mirrors. settingtypes.txt only draws the
      # settings menu, so every value in it was a hand-kept copy of a literal in
      # lib/config.lua and two retunings had to move it by hand (C7, C17). This
      # also fails on a setting config.lua reads and the menu does not offer.
      - name: Check settingtypes.txt is up to date
        run: lua scripts/gen_settingtypes.lua --check
